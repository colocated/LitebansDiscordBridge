name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Both profiles run the test suite as part of the package lifecycle.
      - name: Build Java-8-target JARs
        run: mvn --no-transfer-progress clean package

      - name: Verify Java-8-target JARs contain no newer bytecode
        run: python3 scripts/verify-bytecode.py 8 */target/LiteBansDiscordBridge-*.jar

      - name: Build Java-21-target JARs
        run: mvn --no-transfer-progress clean package -P modern

      - name: Verify Java-21-target JARs contain no newer bytecode
        run: python3 scripts/verify-bytecode.py 21 */target/LiteBansDiscordBridge-*-modern.jar

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
